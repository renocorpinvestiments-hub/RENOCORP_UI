# ui/nginx.conf
# NEW FILE — P2 fix (RENOCORP_PRODUCTION_READINESS.md §5,
# "Docker hardening"). Listens on 8080 (not 80) so nginx can run as
# a non-root user without needing CAP_NET_BIND_SERVICE.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────
    # Complements (does not replace) the backend's own security
    # headers middleware (core/middleware/security_headers.py) —
    # these apply to the static shell served by THIS container.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(), payment=(), usb=()" always;
    # Adjust connect-src to the real API origin(s) in deployment.
    # 'unsafe-inline' on style-src is required because App.jsx
    # injects the design system via a <style> tag at runtime — see
    # src/App.jsx and src/styles.js. This is a controlled, build-time
    # authored stylesheet, not user input, so the XSS risk from
    # allowing inline styles here is low; tighten with a nonce if
    # that assumption ever changes.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 512;

    # Hashed build assets (Vite outputs content-hashed filenames) —
    # safe to cache aggressively; a new deploy ships new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html and the PWA manifest must NOT be cached long-term,
    # or clients can get stuck on a stale build referencing assets
    # that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: HashRouter is used client-side (see
    # shell/AppShell.jsx docstring: "HashRouter (required for
    # Capacitor Android)"), so in practice most routing happens
    # after the '#' and never hits the server — but this fallback
    # keeps direct-load/refresh working correctly regardless.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
