# .github/workflows/ci.yml — RENOCORP frontend
# UPDATED — P0 fix (production-readiness remediation, new finding).
#
# Prior state: this pipeline already ran `npm ci`, and `ui/Dockerfile`
# already used `npm ci` too — but `ui/package-lock.json` was never
# committed to the repo. `npm ci` hard-requires a lockfile, so both
# this pipeline and the Docker build are currently failing outright
# on a clean checkout, not "silently falling back to npm install" as
# an earlier pass assumed.
#
# THIS FILE CANNOT FIX THAT BY ITSELF — a lockfile has to be generated
# against the real npm registry (`cd ui && npm install`) and committed
# by someone with network access; it can't be fabricated. What this
# update adds is a fast, explicit failure with instructions, so the
# next person who hits this gets a one-line fix instead of a cryptic
# `npm ci` error 40 seconds into a run — plus a Trivy scan of the
# built nginx image, which the pipeline had no container scanning for
# at all.
#
# Action required (one-time, outside CI): from a machine with network
# access, run:
#     cd ui && npm install && git add package-lock.json && git commit
name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: ui

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      lockfile-present: ${{ steps.lockfile-check.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify package-lock.json is committed
        id: lockfile-check
        run: |
          if [ ! -f package-lock.json ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error::ui/package-lock.json is missing. 'npm ci' " \
                 "requires a committed lockfile for reproducible, " \
                 "integrity-checked installs. Generate it once from a " \
                 "machine with network access: cd ui && npm install " \
                 "&& git add package-lock.json && git commit"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit + accessibility tests
        run: npm run test

      # P2 fix: continuous dependency-CVE scanning for the frontend
      # (production-readiness item: "Add pip-audit / npm audit /
      # Dependabot to CI to catch CVEs continuously").
      # --audit-level=high: fails CI on high/critical CVEs in
      # production dependencies; lower-severity/dev-only findings
      # are surfaced but don't block the build (tune as the team's
      # risk tolerance is defined).
      - name: npm audit (production dependencies, high+ severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: renocorp-ui-dist
          path: ui/dist
          retention-days: 7

  container-scan:
    # NEW job — mirrors the backend's container-scan job. The
    # frontend Dockerfile builds a real runtime image (nginx +
    # static assets) that ships to production and had no image
    # scanning at all before this.
    runs-on: ubuntu-latest
    needs: build-and-test
    if: needs.build-and-test.outputs.lockfile-present == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: false
          load: true
          tags: renocorp-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: renocorp-ui:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
